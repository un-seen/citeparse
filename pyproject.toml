[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citeparse"
version = "0.2.0"
description = "Parse reference strings into CSL-JSON or BibTeX with a small local model, and flag citations that point to no real work."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["transformers>=4.48", "torch"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
keywords = ["citation", "reference parsing", "bibliography", "csl-json", "bibtex", "crossref", "grobid", "hallucinated citations", "fake references", "mcp"]

[project.scripts]
citeparse = "citeparse.__main__:main"
citeparse-mcp = "citeparse.mcp_server:main"

[project.urls]
Homepage = "https://github.com/un-seen/citeparse"
Model = "https://huggingface.co/hedwigai/citeparse-32m"
Benchmark = "https://huggingface.co/datasets/hedwigai/citeparse-wild-700"
